<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#bfeaff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>학술제 방명록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.2s-8.1-4.9-10.3-10C.2 7.6 2.2 3.8 6.1 3.8c2.2 0 3.8 1.2 4.9 2.8l1 1.4 1-1.4c1.1-1.6 2.7-2.8 4.9-2.8 3.9 0 5.9 3.8 4.4 7.4-2.2 5.1-10.3 10-10.3 10z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M6 2.5h12a2.5 2.5 0 0 1 2.5 2.5v14a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 19V5A2.5 2.5 0 0 1 6 2.5zM8 7h8v2H8zM8 11h8v2H8zM8 15h5v2H8z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21c.4-4.6 3.7-7.2 8.5-7.2s8.1 2.6 8.5 7.2z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2.5h3.2c.4 3.2-1.3 5.6-4.4 6.1-.6 1.2-1.6 2-2.8 2.4V17h3v2.5H8V17h3v-3c-1.2-.4-2.2-1.2-2.8-2.4C5.1 11.1 3.4 8.7 3.8 5.5H7V3zm-1.5 4.4c.1 1.3.8 2.3 2 2.8-.2-.9-.4-1.9-.4-2.8H5.5zm13 0h-1.6c0 .9-.2 1.9-.4 2.8 1.2-.5 1.9-1.5 2-2.8zM6 20.5h12V22H6z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15.5 3.5 7 12l8.5 8.5 2.2-2.2L11.4 12l6.3-6.3z"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M8.5 3.5 17 12l-8.5 8.5-2.2-2.2L12.6 12 6.3 5.7z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2.5a6.5 6.5 0 0 0-6.5 6.5c0 4.7 6.5 12.5 6.5 12.5s6.5-7.8 6.5-12.5A6.5 6.5 0 0 0 12 2.5zm0 9a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></symbol>
  </svg>

  <div id="sky" aria-hidden="true">
    <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
  </div>

  <canvas id="world" aria-label="3D 방명록 월드"></canvas>

  <!-- 로딩 -->
  <section id="loading" class="screen screen--center">
    <div class="loader">
      <div class="loader__mark">Wii</div>
      <h1 class="loader__title">학술제 방명록</h1>
      <div class="bar"><i id="loadFill"></i></div>
      <p id="loadText" class="loader__text">캐릭터를 불러오는 중…</p>
    </div>
  </section>

  <!-- 입력 (3단계) -->
  <section id="setup" class="screen" hidden>
    <div class="setup">
      <header class="setup__head">
        <div class="logo"><span class="logo__year" id="logoYear">2026</span><span class="logo__title" id="logoTitle">학술제 방명록</span></div>
        <ol class="steps" aria-label="진행 단계">
          <li data-step="1"><b>1</b><span>캐릭터</span></li>
          <li data-step="2"><b>2</b><span>이름·학년</span></li>
          <li data-step="3"><b>3</b><span>방명록</span></li>
        </ol>
      </header>

      <p id="setupNote" class="note" hidden></p>

      <form id="setupForm" novalidate autocomplete="off">
        <!-- 1. 캐릭터 -->
        <div class="step" data-step="1">
          <div class="stage panel">
            <canvas id="previewCanvas" aria-label="선택한 캐릭터 미리보기. 좌우로 드래그하면 돌아가요."></canvas>
            <button type="button" class="arrow arrow--l" id="charPrev" aria-label="이전 캐릭터"><svg class="ic"><use href="#i-left"/></svg></button>
            <button type="button" class="arrow arrow--r" id="charNext" aria-label="다음 캐릭터"><svg class="ic"><use href="#i-right"/></svg></button>
            <div class="stage__label"><span id="charGender" class="gender"></span><strong id="charName"></strong></div>
          </div>

          <div class="seg" role="radiogroup" aria-label="옷 선택">
            <button type="button" role="radio" data-jacket="0" class="seg__btn">사복</button>
            <button type="button" role="radio" data-jacket="1" class="seg__btn">과잠</button>
          </div>

          <div id="picker" class="picker" role="radiogroup" aria-label="캐릭터 선택"></div>
        </div>

        <!-- 2. 이름 · 학년 -->
        <div class="step" data-step="2" hidden>
          <div class="panel field-panel">
            <div class="mini-avatar"><img id="miniAvatar" alt=""></div>
            <label class="field">
              <span class="field__label">이름 <em>실명</em></span>
              <input id="nameInput" name="name" type="text" maxlength="10" placeholder="홍길동" enterkeyhint="next">
              <small class="field__err" id="nameErr" role="alert"></small>
            </label>
            <fieldset class="field">
              <legend class="field__label">학년 <em>이름표에 표시돼요</em></legend>
              <div id="gradeChips" class="gchips"></div>
              <small class="field__err" id="gradeErr" role="alert"></small>
            </fieldset>
            <div class="tagpreview" aria-live="polite">
              <span class="tagpreview__cap">월드에서는 이렇게 보여요</span>
              <span class="nametag" id="tagPreview"><b class="nametag__grade">학년</b><span class="nametag__name">이름</span></span>
            </div>
          </div>
        </div>

        <!-- 3. 방명록 -->
        <div class="step" data-step="3" hidden>
          <div class="panel field-panel">
            <label class="field">
              <span class="field__label">방명록 <em>월드 대시보드에 올라가요</em></span>
              <textarea id="msgInput" name="message" rows="5" maxlength="80" placeholder="학술제에 온 소감이나 응원의 한마디를 남겨 주세요!"></textarea>
              <div class="field__row">
                <small class="field__err" id="msgErr" role="alert"></small>
                <small class="counter"><span id="msgCount">0</span>/80</small>
              </div>
            </label>
            <p class="hint"><svg class="ic"><use href="#i-heart"/></svg>하트를 많이 받으면 광장 한가운데 <b>Top 3 팻말</b>에 걸려요.</p>
          </div>
        </div>

        <footer class="setup__nav">
          <button type="button" class="btn" id="btnPrev">이전</button>
          <button type="button" class="btn btn--primary" id="btnNext">다음</button>
        </footer>
      </form>
    </div>
  </section>

  <!-- 월드 HUD -->
  <div id="hud" hidden>
    <div class="topbar">
      <div class="pill"><span class="pill__mark">W</span><span id="hudTitle">학술제 방명록</span></div>
      <button type="button" class="roundbtn roundbtn--sm" id="btnPlaza" aria-label="광장으로 이동">
        <svg class="ic"><use href="#i-trophy"/></svg>
      </button>
    </div>

    <aside id="nearCard" class="near" hidden aria-live="polite"></aside>

    <div id="stick" class="stick" aria-label="이동 조이스틱"><div class="stick__knob"></div></div>
    <button type="button" id="jump" class="abtn" aria-label="점프">A</button>

    <nav class="wiibar">
      <button type="button" class="roundbtn roundbtn--l" id="btnBoard">
        <svg class="ic"><use href="#i-book"/></svg><span>방명록</span><i class="badge" id="boardCount">0</i>
      </button>
      <div class="clock"><b id="clockTime">--:--</b><small id="clockDate"></small></div>
      <button type="button" class="roundbtn roundbtn--l" id="btnMe">
        <svg class="ic"><use href="#i-person"/></svg><span>내 정보</span>
      </button>
    </nav>
  </div>

  <!-- 방명록 대시보드 -->
  <div id="boardRoot" class="sheetroot" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
      <header class="sheet__head">
        <h2 id="boardTitle">방명록</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-sort="likes" class="tab is-on">인기순</button>
          <button type="button" role="tab" data-sort="new" class="tab">최신순</button>
        </div>
      </header>
      <div id="boardList" class="sheet__list"></div>
      <footer class="sheet__foot">
        <small id="modeNote"></small>
        <button type="button" class="btn btn--primary" data-close>돌아가기</button>
      </footer>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
